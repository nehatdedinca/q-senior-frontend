<div class="dashboard">
  @if (asset$ | async; as asset) {
    <app-asset-header [asset]="asset"></app-asset-header>

    <div class="dashboard__grid">
      <app-asset-details [asset]="asset"></app-asset-details>
      <app-performance-analytics [asset]="asset"></app-performance-analytics>
    </div>

    <app-transaction-history [asset]="asset"></app-transaction-history>

    <p class="dashboard__disclaimer">
      Demo data for illustrative purposes only - not a real asset, valuation or transaction record.
    </p>
  } @else {
    <div class="dashboard__loading">
      <mat-spinner></mat-spinner>
    </div>
  }
</div>
