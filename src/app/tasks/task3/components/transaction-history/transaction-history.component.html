<mat-card class="transaction-history" appearance="outlined">
  <h2 class="transaction-history__title">Transaction History</h2>
  <p class="transaction-history__subtitle">Recent comparable sales of similar examples</p>

  <table mat-table [dataSource]="asset().comparableSales" class="transaction-history__table">
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let sale">{{ sale.date | date: 'mediumDate' }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let sale">{{ sale.description }}</td>
    </ng-container>

    <ng-container matColumnDef="auctionHouse">
      <th mat-header-cell *matHeaderCellDef>Auction House</th>
      <td mat-cell *matCellDef="let sale">{{ sale.auctionHouse }}</td>
    </ng-container>

    <ng-container matColumnDef="location">
      <th mat-header-cell *matHeaderCellDef>Location</th>
      <td mat-cell *matCellDef="let sale">{{ sale.location }}</td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Sale Price</th>
      <td mat-cell *matCellDef="let sale" class="transaction-history__price">
        {{ sale.price | currency: asset().currency : 'symbol' : '1.0-0' }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</mat-card>
